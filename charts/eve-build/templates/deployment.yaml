apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.eveBuild.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- with .Values.eveBuild.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.eveBuild.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-serviceaccount
      {{- with .Values.eveBuild.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eveBuild.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eveBuild.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.eveBuild.imageRepository }}:{{ .Values.eveBuild.imageTag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.eveBuild.imagePullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "eve-build.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.eveBuild.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.eveBuild.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # /health only starts responding once the app finishes its startup lifespan,
            # which runs pending Mongo migrations first (e.g. backfilling every cached SDE
            # type document) - that can run well past a minute on a cold cache, so this needs
            # enough headroom to outlast it. Readiness/liveness only start probing once this
            # succeeds, so it doesn't slow down an already-migrated restart.
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
