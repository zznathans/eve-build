{{- if .Values.eveBuild.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}
  minReplicas: {{ .Values.eveBuild.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.eveBuild.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.eveBuild.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.eveBuild.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.eveBuild.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.eveBuild.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- with .Values.eveBuild.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
