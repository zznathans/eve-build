{{- if .Values.mongodb.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mongodb-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mongodb-exporter
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mongodb-exporter
    spec:
      containers:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:{{ .Values.mongodb.exporter.version }}
          args:
            - --mongodb.global-conn-pool
            - --collector.diagnosticdata
            - --collector.dbstats
            {{- with .Values.mongodb.exporter.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "eve-build.mongodbExporterUriEnv" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9216
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.mongodb.exporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongodb-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-mongodb-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: {{ .Release.Name }}-mongodb-exporter
  ports:
    - name: metrics
      port: 9216
      targetPort: metrics
{{- end }}
