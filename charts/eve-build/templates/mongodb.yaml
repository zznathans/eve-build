{{- if .Values.mongodb.enabled }}
{{- $secretName := .Values.mongodb.passwordSecretName | default (printf "%s-mongodb-password" .Release.Name) }}
{{- if not .Values.mongodb.passwordSecretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  # Generated once, then kept stable across upgrades by reusing whatever's
  # already in the cluster - lookup returns an existing Secret's data if
  # there is one, otherwise this generates a fresh password. lookup always
  # comes back empty outside a real install/upgrade (e.g. helm
  # template/lint), so those still render deterministically-shaped output,
  # just with a different random password each time.
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
{{- end }}
{{- if .Values.mongodb.exporter.enabled }}
{{- $exporterSecretName := printf "%s-mongodb-exporter-password" .Release.Name }}
{{- $exporterExisting := lookup "v1" "Secret" .Release.Namespace $exporterSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $exporterSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  # Same generate-once-then-reuse approach as the app's own password Secret above.
  password: {{ if $exporterExisting }}{{ index $exporterExisting.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
{{- end }}
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ .Release.Name }}-mongodb
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  members: {{ .Values.mongodb.members }}
  type: ReplicaSet
  version: {{ .Values.mongodb.version | quote }}
  security:
    authentication:
      modes: ["SCRAM"]
    {{- if .Values.mongodb.exporter.enabled }}
    roles:
      # clusterMonitor doesn't include listCollections on arbitrary databases, which
      # --discovering-mode needs to enumerate each database's collections during discovery -
      # without this, discovery fails with an Unauthorized error on every non-admin database.
      - role: listCollectionsAnyDatabase
        db: admin
        privileges:
          - resource:
              db: ""
              collection: ""
            actions: ["listCollections"]
        roles: []
    {{- end }}
  users:
    - name: {{ .Values.mongodb.username }}
      db: admin
      passwordSecretRef:
        name: {{ $secretName }}
      roles:
        - name: readWrite
          db: {{ .Values.mongodb.database }}
      scramCredentialsSecretName: {{ .Release.Name }}-mongodb-scram
      connectionStringSecretName: {{ .Release.Name }}-mongodb-connection
    {{- if .Values.mongodb.exporter.enabled }}
    - name: {{ .Values.mongodb.exporter.username }}
      db: admin
      passwordSecretRef:
        name: {{ .Release.Name }}-mongodb-exporter-password
      roles:
        # clusterMonitor is the built-in role mongodb_exporter's diagnosticdata/dbstats/
        # topmetrics/indexstats collectors need (serverStatus, replSetGetStatus, dbStats,
        # etc.) - narrower than the app's own readWrite-on-one-database user, and it can't
        # read or write application data. listCollectionsAnyDatabase (defined above) fills the
        # one gap clusterMonitor leaves for --discovering-mode: listCollections on databases
        # other than admin.
        - name: clusterMonitor
          db: admin
        - name: listCollectionsAnyDatabase
          db: admin
      scramCredentialsSecretName: {{ .Release.Name }}-mongodb-exporter-scram
      connectionStringSecretName: {{ .Release.Name }}-mongodb-exporter-connection
    {{- end }}
  statefulSet:
    spec:
      template:
        # metadata is a sibling of spec on a PodTemplateSpec, same as any Pod's own
        # metadata/spec split - nesting it inside spec (as this block previously did) means
        # the operator silently drops it, since PodSpec has no metadata field to merge onto.
        metadata:
          annotations:
            argocd.argoproj.io/sync-wave: "-2"
            {{- if and .Values.mongodb.exporter.enabled .Values.mongodb.exporter.perNode }}
            # Same annotation-based scrape convention mongodb-exporter.yaml's standalone
            # Deployment uses (see its podAnnotations default) - lets a Prometheus without
            # the Operator CRDs installed still pick this sidecar up.
            prometheus.io/scrape: "true"
            prometheus.io/port: "9216"
            prometheus.io/path: /metrics
            {{- end }}
        spec:
          containers:
            - name: mongod
              resources:
                {{- toYaml .Values.mongodb.resources | nindent 16 }}
            {{- if and .Values.mongodb.exporter.enabled .Values.mongodb.exporter.perNode }}
            - name: mongodb-exporter
              image: percona/mongodb_exporter:{{ .Values.mongodb.exporter.version }}
              args:
                # Direct-connected to this pod's own mongod, unlike the centralized
                # Deployment's replica-set-aware URI - so every serverStatus/dbStats-derived
                # metric (mongodb_ss_*, mongodb_dbstats_*) reports on this member specifically,
                # not just whichever one the driver treats as primary. No --discovering-mode:
                # there's only ever the one database's worth of collections to enumerate here.
                - --mongodb.direct-connect
                - --collect-all
                {{- if .Values.mongodb.exporter.compatibleMode }}
                - --compatible-mode
                {{- end }}
                {{- with .Values.mongodb.exporter.extraArgs }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              env:
                - name: MONGO_EXPORTER_USER
                  value: {{ .Values.mongodb.exporter.username }}
                - name: MONGO_EXPORTER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-mongodb-exporter-password
                      key: password
                # $(...) dependent-env-var expansion, not shell substitution - requires the
                # two vars above to already be defined earlier in this same list.
                - name: MONGODB_URI
                  value: "mongodb://$(MONGO_EXPORTER_USER):$(MONGO_EXPORTER_PASSWORD)@localhost:27017/admin?directConnection=true"
              ports:
                - name: metrics
                  containerPort: 9216
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 999
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.mongodb.exporter.resources | nindent 16 }}
            {{- end }}
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: {{ .Values.mongodb.storage }}
{{- end }}
