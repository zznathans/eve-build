suite: market-orders-keda
templates:
  - market-orders-fetch-worker.yaml
  - market-orders-write-worker.yaml
  - market-orders-fetch-worker-scaledobject.yaml
  - market-orders-keda-triggerauth.yaml
  - market-orders-rabbitmq-secret.yaml
set:
  eveBuild.marketPrices.refreshApiKey: my-api-key
  eveBuild.session.secretKey: my-session-key
tests:
  - it: renders no KEDA resources when rabbitmq is enabled but keda is disabled
    set:
      rabbitmq.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: market-orders-fetch-worker-scaledobject.yaml
      - hasDocuments:
          count: 0
        template: market-orders-keda-triggerauth.yaml
      - hasDocuments:
          count: 0
        template: market-orders-rabbitmq-secret.yaml

  - it: renders no KEDA resources when keda is enabled but rabbitmq is disabled
    set:
      keda.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: market-orders-fetch-worker-scaledobject.yaml
      - hasDocuments:
          count: 0
        template: market-orders-keda-triggerauth.yaml
      - hasDocuments:
          count: 0
        template: market-orders-rabbitmq-secret.yaml

  - it: renders the ScaledObject, a TriggerAuthentication and a connection Secret when both are enabled
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: market-orders-fetch-worker-scaledobject.yaml
      - isKind:
          of: ScaledObject
        template: market-orders-fetch-worker-scaledobject.yaml
      - hasDocuments:
          count: 1
        template: market-orders-keda-triggerauth.yaml
      - isKind:
          of: TriggerAuthentication
        template: market-orders-keda-triggerauth.yaml
      - hasDocuments:
          count: 1
        template: market-orders-rabbitmq-secret.yaml
      - isKind:
          of: Secret
        template: market-orders-rabbitmq-secret.yaml

  - it: fetch-worker ScaledObject targets the correct queue and replica bounds
    set:
      rabbitmq.enabled: true
      keda.enabled: true
      eveBuild.marketOrders.fetchWorker.keda.minReplicas: 1
      eveBuild.marketOrders.fetchWorker.keda.maxReplicas: 8
      eveBuild.marketOrders.fetchWorker.keda.queueLength: 10
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-market-orders-fetch-worker
        template: market-orders-fetch-worker-scaledobject.yaml
      - equal:
          path: spec.minReplicaCount
          value: 1
        template: market-orders-fetch-worker-scaledobject.yaml
      - equal:
          path: spec.maxReplicaCount
          value: 8
        template: market-orders-fetch-worker-scaledobject.yaml
      - equal:
          path: spec.triggers[0].metadata.queueName
          value: market_orders.scrape_jobs
        template: market-orders-fetch-worker-scaledobject.yaml
      - equal:
          path: spec.triggers[0].metadata.value
          value: "10"
        template: market-orders-fetch-worker-scaledobject.yaml
      - equal:
          path: spec.triggers[0].authenticationRef.name
          value: RELEASE-NAME-rabbitmq-conn
        template: market-orders-fetch-worker-scaledobject.yaml

  - it: omits replicas on the fetch-worker Deployment when keda is enabled
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
        template: market-orders-fetch-worker.yaml

  - it: sets replicas on the fetch-worker Deployment when keda is disabled
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        template: market-orders-fetch-worker.yaml

  - it: always sets replicas on the write-worker Deployment, keda enabled or not
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: market-orders-write-worker.yaml

  - it: TriggerAuthentication points at the chart-managed secret by default
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - equal:
          path: spec.secretTargetRef[0].name
          value: RELEASE-NAME-rabbitmq-conn
        template: market-orders-keda-triggerauth.yaml
      - equal:
          path: spec.secretTargetRef[0].key
          value: url
        template: market-orders-keda-triggerauth.yaml

  - it: TriggerAuthentication and no rabbitmq secret point at an existingSecret when set
    set:
      rabbitmq.enabled: true
      keda.enabled: true
      rabbitmq.existingSecret: my-rabbitmq-secret
      rabbitmq.existingSecretKey: connectionString
    asserts:
      - hasDocuments:
          count: 0
        template: market-orders-rabbitmq-secret.yaml
      - equal:
          path: spec.secretTargetRef[0].name
          value: my-rabbitmq-secret
        template: market-orders-keda-triggerauth.yaml
      - equal:
          path: spec.secretTargetRef[0].key
          value: connectionString
        template: market-orders-keda-triggerauth.yaml

  - it: syncs the rabbitmq connection secret with the other early secrets (wave -2)
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-2"
        template: market-orders-rabbitmq-secret.yaml

  - it: syncs the TriggerAuthentication after the workers (wave 2)
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: market-orders-keda-triggerauth.yaml

  - it: syncs the ScaledObject last (wave 3)
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: market-orders-fetch-worker-scaledobject.yaml
