suite: market-orders-write-worker
templates:
  - market-orders-write-worker.yaml
set:
  eveBuild.marketPrices.refreshApiKey: my-api-key
  eveBuild.session.secretKey: my-session-key
tests:
  - it: renders nothing when rabbitmq is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Deployment when rabbitmq is enabled
    set:
      rabbitmq.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: defaults to 1 replica
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: uses the configured replica count
    set:
      rabbitmq.enabled: true
      eveBuild.marketOrders.writeWorker.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: still sets replicas when keda is enabled - the write-worker is never KEDA-managed
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: runs the write worker script via the app image
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "app.scripts.market_orders_write_worker"]
