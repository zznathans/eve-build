suite: market-prices-write-worker
templates:
  - market-prices-write-worker.yaml
set:
  eveBuild.marketPrices.refreshApiKey: my-api-key
  eveBuild.session.secretKey: my-session-key
tests:
  - it: renders nothing when rabbitmq is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Deployment when rabbitmq is enabled
    set:
      rabbitmq.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: defaults to 1 replica
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: uses the configured replica count
    set:
      rabbitmq.enabled: true
      eveBuild.marketPrices.writeWorker.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: omits replicas when keda is enabled - the ScaledObject's HPA owns replica count instead
    set:
      rabbitmq.enabled: true
      keda.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: runs the write worker script via the app image
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "app.scripts.market_prices_write_worker"]
