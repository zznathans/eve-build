suite: mongodb-exporter
templates:
  - mongodb-exporter.yaml
tests:
  - it: renders nothing when the exporter is disabled (the default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Deployment and Service when enabled
    set:
      mongodb.exporter.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Deployment
      - documentIndex: 1
        isKind:
          of: Service

  - it: renders nothing when perNode is true, even with the exporter enabled
    set:
      mongodb.exporter.enabled: true
      mongodb.exporter.perNode: true
    asserts:
      - hasDocuments:
          count: 0
