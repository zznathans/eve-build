suite: mongodb
templates:
  - mongodb.yaml
tests:
  - it: renders nothing when disabled (the default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a MongoDBCommunity CR when enabled
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: mongodbcommunity.mongodb.com/v1
      - isKind:
          of: MongoDBCommunity
      - equal:
          path: spec.members
          value: 3

  - it: generates a password Secret when passwordSecretName isn't set
    set:
      mongodb.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Secret
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-mongodb-password
      - documentIndex: 0
        isNotEmpty:
          path: data.password
      - documentIndex: 1
        equal:
          path: spec.users[0].passwordSecretRef.name
          value: RELEASE-NAME-mongodb-password

  - it: does not generate a Secret when passwordSecretName is set explicitly
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
    asserts:
      - hasDocuments:
          count: 1

  - it: scopes the user to the configured database with readWrite
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
      mongodb.username: someuser
      mongodb.database: somedb
    asserts:
      - equal:
          path: spec.users[0].name
          value: someuser
      - equal:
          path: spec.users[0].roles[0]
          value:
            name: readWrite
            db: somedb

  - it: passes the password secret name through
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
    asserts:
      - equal:
          path: spec.users[0].passwordSecretRef.name
          value: eve-build-mongodb-password

  - it: names the connection string secret for the deployment to consume
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
    asserts:
      - equal:
          path: spec.users[0].connectionStringSecretName
          value: RELEASE-NAME-mongodb-connection

  - it: requests storage per member via the volume claim template
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
      mongodb.storage: 20Gi
    asserts:
      - equal:
          path: spec.statefulSet.spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 20Gi

  - it: does not define custom roles or an exporter user when the exporter is disabled
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
    asserts:
      - notExists:
          path: spec.security.roles
      - lengthEqual:
          path: spec.users
          count: 1

  - it: grants the exporter user clusterMonitor plus a custom listCollections role
    set:
      mongodb.enabled: true
      mongodb.passwordSecretName: eve-build-mongodb-password
      mongodb.exporter.enabled: true
      mongodb.exporter.username: someexporter
    documentIndex: 1
    asserts:
      - equal:
          path: spec.security.roles[0]
          value:
            role: listCollectionsAnyDatabase
            db: admin
            privileges:
              - resource:
                  db: ""
                  collection: ""
                actions: ["listCollections"]
            roles: []
      - equal:
          path: spec.users[1].name
          value: someexporter
      - equal:
          path: spec.users[1].roles
          value:
            - name: clusterMonitor
              db: admin
            - name: listCollectionsAnyDatabase
              db: admin
