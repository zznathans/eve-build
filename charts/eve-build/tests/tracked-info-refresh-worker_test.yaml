suite: tracked-info-refresh-worker
templates:
  - tracked-info-refresh-worker.yaml
set:
  eveBuild.marketPrices.refreshApiKey: my-api-key
  eveBuild.session.secretKey: my-session-key
tests:
  - it: renders nothing when rabbitmq is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Deployment when rabbitmq is enabled
    set:
      rabbitmq.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: defaults to 1 replica
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: uses the configured replica count
    set:
      rabbitmq.enabled: true
      eveBuild.trackedInfo.refreshWorker.replicas: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 4

  - it: runs the refresh worker script via the app image
    set:
      rabbitmq.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "app.scripts.tracked_info_refresh_worker"]
