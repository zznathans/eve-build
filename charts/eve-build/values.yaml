eveBuild:
  # -- Number of pod replicas. The app is stateless, so this is safe to scale
  # up freely. Ignored (and no `replicas` field rendered on the Deployment) when
  # `autoscaling.enabled` is true - the HorizontalPodAutoscaler owns replica count instead.
  replicaCount: 1

  autoscaling:
    # -- Deploy a HorizontalPodAutoscaler for the app Deployment. Requires the
    # metrics-server (or equivalent resource-metrics API) already installed in the cluster -
    # this chart only creates the HPA, not a metrics source for it to read from.
    enabled: false
    # -- Minimum replicas the HPA will scale down to.
    minReplicas: 1
    # -- Maximum replicas the HPA will scale up to.
    maxReplicas: 5
    # -- Target average CPU utilization, as a percentage of the app container's CPU request
    # (see `resources.requests.cpu` below). Set to 0/null to omit this metric entirely (e.g.
    # to scale on memory alone).
    targetCPUUtilizationPercentage: 75
    # -- Target average memory utilization, as a percentage of the app container's memory
    # request. Set to 0/null to omit this metric entirely (e.g. to scale on CPU alone) - the
    # app's per-request memory footprint is fairly flat, so CPU alone is a reasonable default.
    targetMemoryUtilizationPercentage: 0
    # -- Raw `behavior` block (scale-up/scale-down policies, stabilization windows) passed
    # through as-is - see the HorizontalPodAutoscaler API docs. Leave empty for Kubernetes'
    # own defaults.
    behavior: {}

  # -- Container image registry and repository for the eve-build image.
  imageRepository: ghcr.io/zznathans/eve-build
  # -- Image tag to deploy. Empty by default: falls back to .Chart.AppVersion,
  # which chart-publish.yml overrides to match the release a published chart
  # was packaged from - so installing a published chart with no override
  # deploys the matching image automatically. Only matters as a literal
  # default for a raw checkout (falls back to Chart.yaml's committed
  # appVersion) or local helm lint/unittest.
  imageTag: ""
  # -- Image pull policy for the app container.
  imagePullPolicy: IfNotPresent
  # -- List of image pull secret names to attach to the ServiceAccount. Leave empty if the registry is public.
  imagePullSecrets: []

  # -- Resource requests and limits for the app container.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  # -- Container securityContext for the app container.
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: ["ALL"]

  # -- Annotations applied to the pod template.
  podAnnotations: {}
  # -- Extra labels applied to the pod template, in addition to the chart's own `app` label.
  podLabels: {}
  # -- Node selector for the pod.
  nodeSelector: {}
  # -- Tolerations for the pod.
  tolerations: []
  # -- Affinity rules for the pod.
  affinity: {}

  # -- Extra environment variables appended to the app container, after the
  # chart's own. Each entry is a raw Kubernetes EnvVar (`name` plus `value`
  # or `valueFrom`) - use this for anything not otherwise exposed below.
  extraEnv: []

  eveSso:
    # -- EVE Online SSO application client ID
    # (https://developers.eveonline.com/applications).
    clientId: ""
    # -- Callback URL registered on the SSO application. Must match exactly.
    callbackUrl: ""
    # -- Space-separated ESI scopes to request during login. May be empty.
    scopes: ""
    # -- Space-separated ESI scopes for the optional, separate "connect
    # corporation data" grant (see /settings in the app) - e.g.
    # esi-assets.read_corporation_assets.v1, esi-corporations.read_blueprints.v1,
    # esi-industry.read_corporation_jobs.v1. Requested only when a character
    # opts in, not during base login. May be empty (feature stays unusable
    # until set, but the app runs fine without it).
    corpScopes: ""
    # -- EVE SSO authorization endpoint.
    authorizeUrl: "https://login.eveonline.com/v2/oauth/authorize"
    # -- EVE SSO token endpoint.
    tokenUrl: "https://login.eveonline.com/v2/oauth/token"
    # -- EVE SSO JWKS endpoint, used to verify token signatures.
    jwksUrl: "https://login.eveonline.com/oauth/jwks"
    # -- Expected `iss` claim on SSO tokens.
    issuer: "https://login.eveonline.com"
    # -- Expected `aud` claim on SSO tokens.
    audience: "EVE Online"

  esi:
    # -- Base URL for the EVE Swagger Interface.
    baseUrl: "https://esi.evetech.net"
    # -- ESI compatibility date header value.
    compatibilityDate: "2026-08-18"
    # -- User-Agent sent on ESI requests - identify your deployment per ESI's guidelines.
    userAgent: "eve-build"

  session:
    # -- Value used to sign the session cookie. Required unless
    # `existingSecret` is set - generate one with `openssl rand -hex 32`.
    # The chart stores it in a Secret rather than inlining it into the
    # Deployment spec.
    secretKey: ""
    # -- Name of an existing Secret holding the session signing key, used
    # instead of `secretKey` when set.
    existingSecret: ""
    # -- Key within `existingSecret` holding the session signing key.
    existingSecretKey: "secretKey"
    # -- Name of the session cookie.
    cookieName: "eve_build_session"
    # -- Session cookie lifetime, in seconds.
    maxAgeSeconds: 1209600

  marketPrices:
    # -- Shared secret the on-demand `/market-prices/refresh` endpoint requires via the
    # `X-Api-Key` header. Prices also refresh automatically every hour via the dispatch
    # CronJob below (when rabbitmq.enabled) - this endpoint is only for triggering an
    # out-of-cycle refresh manually. Required unless `existingSecret` is set - generate one
    # with `openssl rand -hex 32`.
    refreshApiKey: ""
    # -- Name of an existing Secret holding the refresh API key, used
    # instead of `refreshApiKey` when set.
    existingSecret: ""
    # -- Key within `existingSecret` holding the refresh API key.
    existingSecretKey: "apiKey"

    # -- Only rendered when rabbitmq.enabled is true - the dispatch CronJob and fetch/write
    # worker Deployments below all publish/consume via RabbitMQ, so there's nothing to deploy
    # without it.
    #
    # Cron schedule the dispatch CronJob uses to enqueue an hourly price-refresh job.
    dispatchSchedule: "0 * * * *"
    # -- Shared KEDA settings for both worker ScaledObjects below. Only used when
    # `keda.enabled` is true - see the top-level `keda` section.
    keda:
      # -- How often (in seconds) KEDA polls RabbitMQ for the current queue length.
      pollingInterval: 15
      # -- How long (in seconds) to wait after the last high metric value before scaling back down.
      cooldownPeriod: 120
    fetchWorker:
      # -- Number of fetch-worker replicas. Ignored (and no `replicas` field rendered on the
      # Deployment) when `keda.enabled` is true - the ScaledObject's HPA owns replica count
      # instead. Fetches the current ESI price list and publishes it for the write-worker to
      # persist.
      replicas: 1
      # -- Resource requests and limits for the fetch-worker container.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      keda:
        # -- Minimum fetch-worker replicas KEDA will scale down to - 0 lets it scale to zero
        # between hourly dispatch runs once the refresh_jobs queue drains.
        minReplicas: 0
        # -- Maximum fetch-worker replicas KEDA will scale up to.
        maxReplicas: 2
        # -- Target number of queued refresh jobs per replica - KEDA scales so that
        # (queue length / queueLength) replicas are running, up to maxReplicas.
        queueLength: 1
    writeWorker:
      # -- Number of write-worker replicas. Ignored (and no `replicas` field rendered on the
      # Deployment) when `keda.enabled` is true - the ScaledObject's HPA owns replica count
      # instead. Persists refreshed prices into MongoDB.
      replicas: 1
      # -- Resource requests and limits for the write-worker container.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      keda:
        # -- Minimum write-worker replicas KEDA will scale down to.
        minReplicas: 0
        # -- Maximum write-worker replicas KEDA will scale up to.
        maxReplicas: 2
        # -- Target number of queued refresh results per replica.
        queueLength: 1

  # -- Directory the bundled EVE SDE data is read from at migration time.
  # Only override this if you're mounting a custom SDE dataset.
  sdeDataDir: "app/data/sde"
  # -- Run pending database migrations (including the initial SDE import)
  # automatically on startup.
  runMigrationsOnStartup: true
  # -- TTL (seconds) on the Mongo-based lock a pod holds while running migrations/index
  # sync on startup - every replica attempts this on every start (there's no separate
  # migration Job), so the lock keeps concurrent pods from racing on the same not-yet-
  # applied migration. A holder pod that crashes without releasing leaves the lock
  # reclaimable after this many seconds. Keep comfortably below
  # startupProbe.periodSeconds * startupProbe.failureThreshold, and above
  # startupLockWaitTimeoutSeconds below.
  startupLockTtlSeconds: 480
  # -- How often (seconds) a pod waiting on the startup lock polls for it to free up.
  startupLockPollIntervalSeconds: 2
  # -- Max time (seconds) a pod will wait to acquire the startup lock before giving up and
  # crashing - Kubernetes then restarts it, and it retries acquisition from scratch.
  startupLockWaitTimeoutSeconds: 420

  startupProbe:
    # -- Seconds between startup-probe checks.
    periodSeconds: 10
    # -- Consecutive failures allowed before Kubernetes kills the pod during startup.
    # periodSeconds * failureThreshold must comfortably outlast both a slow first-boot
    # migration run AND startupLockWaitTimeoutSeconds above - a pod waiting on another
    # pod's migration lock must not be killed before the holder can finish and release.
    failureThreshold: 60

  service:
    # -- Port the Service listens on and forwards to the container's 8000.
    port: 80

  ingress:
    # -- Create an Ingress routing to this app's Service. Off by default -
    # see the chart README for why (the Service is meant to sit behind
    # whatever externally-managed ingress/traffic routing your cluster
    # already uses; this is an opt-in alternative for clusters that route
    # via a Kubernetes Ingress controller instead).
    enabled: false
    # -- Hostname to route to this app. Required when enabled.
    host: ""
    # -- IngressClass to use (e.g. "traefik"). Empty uses the cluster's
    # default IngressClass.
    className: ""
    # -- Extra annotations on the Ingress - e.g.
    # cert-manager.io/cluster-issuer, to have cert-manager automatically
    # issue the TLS certificate referenced by ingress.tls.secretName below.
    annotations: {}
    tls:
      # -- Terminate TLS on the Ingress. Typically paired with a
      # cert-manager.io/cluster-issuer annotation above so the certificate
      # is issued automatically.
      enabled: false
      # -- Name of the Secret holding the TLS certificate. When using
      # cert-manager, this is the Secret it creates/manages - pick any
      # name.
      secretName: ""

  metrics:
    # -- Expose Prometheus-compatible metrics at GET /metrics.
    enabled: false
    serviceMonitor:
      # -- Deploy a ServiceMonitor for Prometheus Operator to scrape
      # /metrics automatically. Requires the Prometheus Operator CRDs
      # already installed in the cluster, and `eveBuild.metrics.enabled:
      # true`.
      enabled: false
      # -- Scrape interval.
      interval: 30s
      # -- Extra labels on the ServiceMonitor, e.g. for a Prometheus
      # instance's serviceMonitorSelector.
      labels: {}
    dashboard:
      # -- Ship a Grafana dashboard (charts/eve-build/files/dashboards/eve-build.json) as a
      # ConfigMap labeled `grafana_dashboard: "1"`, picked up automatically by a
      # grafana-sidecar (https://github.com/kiwigrid/k8s-sidecar) watching for that label -
      # the same mechanism most kube-prometheus-stack/Grafana Helm installs use. Requires such
      # a sidecar already running against this namespace (its `searchNamespace` must include
      # this release's namespace, or be "ALL" - by default many installs only watch Grafana's
      # own namespace).
      enabled: false
      # -- Folder (relative to the sidecar's dashboard mount) this dashboard is placed into,
      # via the `k8s-sidecar-target-directory` annotation.
      folder: "eve-build"

  # -- Raw Kubernetes objects to render alongside chart-managed resources.
  extraObjects: []

mongodb:
  # -- Deploy a MongoDBCommunity custom resource for this release. Requires
  # the MongoDB Community Kubernetes Operator
  # (https://github.com/mongodb/mongodb-kubernetes-operator) already
  # installed in the cluster - this chart only creates the CR, not the
  # operator itself.
  enabled: false

  # -- Number of replica set members.
  members: 3
  # -- MongoDB server version to run.
  version: "7.0.14"
  # -- Storage requested per member's PersistentVolumeClaim.
  storage: 10Gi

  # -- Database user the operator creates.
  username: eve-build
  # -- Database the user is scoped to, via a readWrite role, and the database name the app
  # is told to use (MONGODB_DATABASE). Ignored when `externalSecret.enabled` is true - in
  # that mode the database name comes from the external secret's own `db_name` field
  # instead, so it can't drift out of sync with what the assembled connection URI points at.
  database: eve-build
  # -- Name of an existing Secret holding the user's password under a
  # `password` key - e.g. via External Secrets, or `kubectl create secret
  # generic <name> --from-literal=password=...`. Leave empty to have the
  # chart generate and manage a random password itself, in a Secret named
  # "<release-name>-mongodb-password" - generated once and kept stable
  # across upgrades (reuses the existing Secret's password if there is one).
  passwordSecretName: ""

  # -- Resource requests and limits for the mongod container.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Plain MongoDB connection string for the app to use when `enabled` is
  # false and `existingSecret` isn't set - e.g. an external/managed MongoDB
  # instance outside the cluster. Ignored when `enabled` is true (the
  # in-cluster MongoDBCommunity's own connection string is used instead).
  uri: "mongodb://localhost:27017"
  # -- Name of an existing Secret holding a MongoDB connection string, used
  # instead of `uri` when set - e.g. via External Secrets. Ignored when
  # `enabled` or `externalSecret.enabled` is true.
  existingSecret: ""
  # -- Key within `existingSecret` holding the connection string.
  existingSecretKey: "uri"

  externalSecret:
    # -- Deploy an ExternalSecret (https://external-secrets.io) that syncs
    # MongoDB connection details from an external secret store into a
    # Secret this chart's Deployment then reads - an alternative to
    # `existingSecret` when you'd rather have the chart manage the
    # ExternalSecret object itself. Requires the External Secrets Operator
    # already installed in the cluster. Ignored when `mongodb.enabled` is
    # true; takes precedence over `existingSecret`/`uri` when set.
    enabled: false
    # -- Name of the (Cluster)SecretStore to pull from.
    secretStoreRef: ""
    # -- Kind of the store referenced above - SecretStore or
    # ClusterSecretStore.
    secretStoreKind: SecretStore
    # -- Key/path within the external store holding the connection details.
    # The remote secret is expected to be a JSON object with `db_host`,
    # `db_host_public`, `db_port`, `db_user`, `db_password`, and `db_name`
    # keys - the shape DigitalOcean Managed MongoDB writes - which are
    # assembled into a `mongodb+srv://` connection string (`db_port` is
    # unused: DigitalOcean's managed MongoDB hosts only resolve via SRV/TXT
    # records, not a plain A record, so the actual host:port pairs and
    # replica set name come from DNS instead of being embedded in the URI).
    remoteKey: ""
    # -- Use `db_host_public` instead of `db_host` when assembling the
    # connection string - e.g. when the app isn't on the same VPC/network
    # as the database and can only reach it over its public endpoint.
    usePublicHost: false
    # -- Query string appended to the assembled connection string (e.g.
    # authSource, tls). Leave empty to omit. DigitalOcean Managed MongoDB
    # requires TLS and an admin authSource.
    uriOptions: "authSource=admin&tls=true"
    # -- How often the ExternalSecret refreshes from the store.
    refreshInterval: 1h

  exporter:
    # -- Deploy a standalone mongodb_exporter (https://github.com/percona/mongodb_exporter)
    # Deployment, exposing Prometheus-compatible metrics at :9216/metrics. Unlike
    # `redis.exporter` (a sidecar, since bundled Redis is the only supported mode), this
    # works regardless of which MongoDB mode is active - bundled (`mongodb.enabled`),
    # `externalSecret`, `existingSecret`, or a plain `uri`. When `mongodb.enabled` is true,
    # mongodb.yaml also creates a dedicated clusterMonitor-scoped user for it (see
    # `username` below) rather than reusing the app's own readWrite-on-one-database user,
    # which lacks the privileges most collectors need.
    enabled: false
    # -- mongodb_exporter image tag to run.
    version: "0.40"
    # -- Username for the dedicated clusterMonitor-role user mongodb.yaml creates for the
    # exporter. Only applies when `mongodb.enabled` is true - there's no user to create when
    # MongoDB is external/managed, see `existingSecret` below for that case instead.
    username: eve-build-exporter
    # -- Name of an existing Secret holding a MongoDB connection string for a
    # monitoring-scoped user, used when `mongodb.enabled` is false - e.g. a clusterMonitor
    # user you created yourself on an external/managed MongoDB. Falls back to the app's own
    # MONGODB_URI (reduced metrics coverage) when unset. Ignored when `mongodb.enabled` is
    # true (the dedicated in-chart user's connection string is used instead).
    existingSecret: ""
    # -- Key within `existingSecret` holding the connection string.
    existingSecretKey: "uri"
    # -- Pass --compatible-mode, which also exposes the old (v1-style) metric names/labels
    # alongside the current ones, so dashboards built against the older exporter (e.g.
    # Percona's own Grafana dashboards) keep working unmodified.
    compatibleMode: true
    # -- Pass --discovering-mode, which has the exporter discover every shard and replica
    # set member behind the connection URI and scrape each of them individually, instead of
    # only whichever member the driver happens to route the connection to. Matches
    # `--mongodb.global-conn-pool`/`--no-mongodb.direct-connect` above, which are needed
    # precisely because the URI here typically names multiple hosts (bundled
    # MongoDBCommunity) or is SRV-discovered (DigitalOcean Managed MongoDB) - both are
    # multi-member deployments where scraping only one member would miss the rest.
    discoveringMode: true
    # -- Extra command-line flags appended after the collector flags this chart always passes
    # (--mongodb.global-conn-pool, --no-mongodb.direct-connect, --collect-all,
    # --discovering-mode if `discoveringMode` is true, and --compatible-mode if
    # `compatibleMode` is true). The dedicated clusterMonitor user (or your own external one)
    # needs the matching privileges for whatever you add here.
    extraArgs: []
    # -- Annotations on the mongodb-exporter pod. Defaults to the classic prometheus.io/scrape
    # annotation convention (unlike eveBuild.podAnnotations, which defaults empty) as a
    # fallback scrape path alongside the ServiceMonitor below - if the cluster's Prometheus
    # isn't running the Prometheus Operator (or nothing is configured to watch ServiceMonitor
    # CRDs), the ServiceMonitor alone silently scrapes nothing. Harmless to leave on even when
    # the ServiceMonitor path does work.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9216"
      prometheus.io/path: /metrics
    # -- Resource requests and limits for the mongodb-exporter container.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    serviceMonitor:
      # -- Deploy a ServiceMonitor for Prometheus Operator to scrape the exporter
      # automatically. Requires the Prometheus Operator CRDs already installed in the
      # cluster, and `mongodb.exporter.enabled`.
      enabled: false
      # -- Scrape interval.
      interval: 30s
      # -- Extra labels on the ServiceMonitor (e.g. for a Prometheus instance's
      # serviceMonitorSelector).
      labels: {}

redis:
  # -- Deploy a Redis instance for this release. The app uses it as an
  # optional read-through cache for reference data (SDE type/blueprint
  # lookups, resolved location names) to cut down on MongoDB reads - it's
  # not a hard dependency, the app falls back to querying MongoDB directly
  # if Redis is disabled or unreachable.
  enabled: false

  # -- Redis image tag to run.
  version: "7.4-alpine"

  # -- Resource requests and limits for the redis container.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # -- External Redis URL for the app to use when `enabled` is false but
  # you still want the read-through cache backed by a Redis instance
  # outside the cluster. Ignored (and REDIS_ENABLED left off) when both
  # this and `enabled` are unset/false.
  url: ""
  # -- How long cached SDE/location lookups are kept, in seconds. Only
  # relevant when Redis is enabled (bundled or external).
  cacheTtlSeconds: 86400

  exporter:
    # -- Deploy a redis_exporter sidecar alongside the bundled Redis instance,
    # exposing Prometheus-compatible metrics at :9121/metrics. Only applies
    # when `redis.enabled` is true (bundled Redis) - there's nothing to
    # sidecar onto for an external Redis.
    enabled: false
    # -- redis_exporter image tag to run.
    version: "v1.66.0"
    # -- Resource requests and limits for the redis-exporter container.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    serviceMonitor:
      # -- Deploy a ServiceMonitor for Prometheus Operator to scrape the
      # exporter automatically. Requires the Prometheus Operator CRDs
      # already installed in the cluster, and `redis.exporter.enabled`.
      enabled: false
      # -- Scrape interval.
      interval: 30s
      # -- Extra labels on the ServiceMonitor (e.g. for a Prometheus
      # instance's serviceMonitorSelector).
      labels: {}

rabbitmq:
  # -- Enable RabbitMQ connectivity for the app (sets RABBITMQ_ENABLED and
  # wires up RABBITMQ_URL below). Leave disabled if the app has no messaging
  # use yet. Point `url` (or `existingSecret`) at wherever RabbitMQ actually
  # runs - either an external/managed instance, or the RabbitmqCluster this
  # chart can provision itself when `deploy` is also true.
  enabled: false

  # -- Deploy a RabbitmqCluster custom resource (named
  # "<release-name>-rabbitmq") for this release. Requires the RabbitMQ
  # Cluster Operator (https://github.com/rabbitmq/cluster-operator) already
  # installed in the cluster - this chart only creates the CR, not the
  # operator itself. Ignored when `enabled` is false. Leave false to instead
  # point `url`/`existingSecret` at an external/managed RabbitMQ instance.
  deploy: false
  # -- RabbitMQ replica count for the self-deployed cluster.
  replicas: 1
  # -- Storage requested per node's PersistentVolumeClaim, for the
  # self-deployed cluster.
  storage: 5Gi
  # -- StorageClass for the self-deployed cluster's PersistentVolumeClaims.
  storageClassName: do-block-storage-xfs
  # -- Resource requests and limits for the self-deployed cluster's rabbitmq
  # container.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  # -- AMQP connection URL for the app to use when `existingSecret` isn't
  # set - e.g. an external/managed RabbitMQ instance, or the self-deployed
  # cluster's Service (<release-name>-rabbitmq.<namespace>.svc.cluster.local).
  url: "amqp://guest:guest@localhost:5672/"
  # -- Name of an existing Secret holding the AMQP connection URL, used
  # instead of `url` when set - e.g. via External Secrets.
  existingSecret: ""
  # -- Key within `existingSecret` holding the connection URL.
  existingSecretKey: "url"

keda:
  # -- Autoscale the market-prices fetch/write worker Deployments with KEDA
  # (https://keda.sh) ScaledObjects driven by RabbitMQ queue length, instead of the fixed
  # `fetchWorker.replicas`/`writeWorker.replicas` counts. Requires the KEDA operator already
  # installed in the cluster and `rabbitmq.enabled: true` - ignored otherwise. When enabled,
  # workers can scale to zero between dispatch runs and scale up automatically under backlog.
  enabled: false
