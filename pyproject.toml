[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-build"
version = "0.1.0"
description = "Python app that runs in Docker, with tests, linting, and CI/CD wired up."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27",
    "motor>=3.4,<4.0",
    "pydantic-settings>=2.2,<3.0",
    "itsdangerous>=2.1",
    "pyjwt[crypto]>=2.8",
    "pymongo>=4.6,<5.0",
    "redis>=5.0,<9.0",
    "aio-pika>=9.4,<11.0",
    "prometheus-fastapi-instrumentator>=8.0,<9.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "mongomock-motor>=0.0.29",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
